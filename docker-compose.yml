services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: oneincdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=oneincdb;Username=postgres;Password=postgres123"
      Jwt__Secret: "ThisIsASecretKeyForOneIncTaskWithAtLeast32Characters!"
      Jwt__Issuer: "OneIncTask"
      Jwt__Audience: "OneIncTask"
      Jwt__ExpirationInMinutes: "480"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    depends_on:
      - api

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    environment:
      API_UPSTREAM: api:8080
      FRONTEND_UPSTREAM: frontend:80
      API_HOST: api
      FRONTEND_HOST: frontend
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started

volumes:
  pgdata:

events {
    worker_connections 1024;
}

http {
    upstream api_backend {
        server ${API_UPSTREAM};
    }

    upstream frontend_backend {
        server ${FRONTEND_UPSTREAM};
    }

    server {
        listen 80;

        # Use HTTP/1.1 for all proxy connections (required by Container Apps Envoy)
        proxy_http_version 1.1;

        # Health check - no auth required
        location /health {
            auth_basic off;
            proxy_pass http://api_backend/health;
            proxy_set_header Host ${API_HOST};
        }

        # Auth token endpoint - requires basic auth, issues JWT
        location = /api/auth/token {
            auth_basic "OneIncTask";
            auth_basic_user_file /etc/nginx/.htpasswd;

            proxy_pass http://api_backend;
            proxy_set_header Host ${API_HOST};
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Auth-User $remote_user;
        }

        # API endpoints - protected by JWT on the API side
        location /api/ {
            proxy_pass http://api_backend;
            proxy_set_header Host ${API_HOST};
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;
        }

        # SignalR hub - WebSocket support, protected by JWT via query string
        location /hub/ {
            proxy_pass http://api_backend;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host ${API_HOST};
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400;
        }

        # Static assets - no auth required (referenced from HTML which is auth-protected)
        location /assets/ {
            proxy_pass http://frontend_backend;
            proxy_set_header Host ${FRONTEND_HOST};
            proxy_set_header Connection "";
            proxy_buffering on;
            proxy_buffer_size 128k;
            proxy_buffers 8 256k;
            proxy_busy_buffers_size 512k;
            proxy_read_timeout 60s;
        }

        # Frontend SPA
        location / {
            auth_basic "OneIncTask";
            auth_basic_user_file /etc/nginx/.htpasswd;

            proxy_pass http://frontend_backend;
            proxy_set_header Host ${FRONTEND_HOST};
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Connection "";
            proxy_buffering on;
            proxy_buffer_size 128k;
            proxy_buffers 8 256k;
            proxy_busy_buffers_size 512k;
            proxy_read_timeout 60s;
        }
    }
}
